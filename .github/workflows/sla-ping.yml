name: sla-ping

# Wakes the API and runs the SLA reminder scan (P9.4). GitHub may delay scheduled runs; a sleeping
# service adds a cold start. Idempotent: a reminder level is claimed once.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the SLA scan
        env:
          API_URL: ${{ vars.API_URL }}
          AI_SERVICE_TOKEN: ${{ secrets.AI_SERVICE_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$AI_SERVICE_TOKEN" ]; then
            echo "::warning::API_URL variable or AI_SERVICE_TOKEN secret is not set; skipping the SLA scan."
            exit 0
          fi
          curl --fail --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $AI_SERVICE_TOKEN" "${API_URL%/}/v1/cron/sla"
