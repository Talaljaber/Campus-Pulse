# Judging-week keep-alive (P8.8). Every 6 hours: wake the API, wake the web app, and touch the database so a
# Supabase free project does not pause for inactivity. No secrets in this file: every value comes from
# repository Variables / Secrets (Settings, Secrets and variables, Actions). A missing value skips that
# check with a warning; a failing check fails the run (GitHub then emails the repo owner).
#
#   Variables: API_URL (https://<service>.onrender.com), WEB_URL (https://<site>.netlify.app),
#              SUPABASE_URL (https://<ref>.supabase.co), DEMO_STUDENT_EMAIL (the demo student login)
#   Secrets:   SUPABASE_ANON_KEY (public by design, kept as a secret anyway), DEMO_STUDENT_PASSWORD
#
# GET /health on the API does not query the database, so the third step does: it signs in as the demo student
# (Supabase Auth reads auth.users) and reads the FAQ view with that session (reads public.faq).
name: keepalive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      DEMO_STUDENT_EMAIL: ${{ vars.DEMO_STUDENT_EMAIL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DEMO_STUDENT_PASSWORD: ${{ secrets.DEMO_STUDENT_PASSWORD }}
    steps:
      - name: API /health
        run: |
          if [ -z "$API_URL" ]; then echo "::warning::API_URL variable not set, skipped"; exit 0; fi
          # --retry covers a cold start (the image loads the model before it answers).
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            "${API_URL%/}/health" | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Web app
        run: |
          if [ -z "$WEB_URL" ]; then echo "::warning::WEB_URL variable not set, skipped"; exit 0; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --retry-all-errors --max-time 60 \
            --output /dev/null --write-out 'web %{http_code}\n' "${WEB_URL%/}/login"

      - name: Database (sign in, read the FAQ view)
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$DEMO_STUDENT_EMAIL" ] || [ -z "$DEMO_STUDENT_PASSWORD" ]; then
            echo "::warning::Supabase variables or secrets not set, database touch skipped"; exit 0
          fi
          body=$(jq -n --arg e "$DEMO_STUDENT_EMAIL" --arg p "$DEMO_STUDENT_PASSWORD" '{email:$e,password:$p}')
          token=$(curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d "$body" \
            "${SUPABASE_URL%/}/auth/v1/token?grant_type=password" | jq -r .access_token)
          [ -n "$token" ] && [ "$token" != "null" ]
          echo "::add-mask::$token"
          curl --fail --silent --show-error --max-time 30 --output /dev/null --write-out 'faq_v %{http_code}\n' \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token" \
            "${SUPABASE_URL%/}/rest/v1/faq_v?select=id&limit=1"
