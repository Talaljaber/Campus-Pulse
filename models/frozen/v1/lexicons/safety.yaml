# Safety lexicon (P1.5, ARCHITECTURE §2.0, LD-19). Read by campuspulse_ai.adapters.guards.bank.compile_bank and
# load_texts. train.py snapshots this file into models/frozen/vN/lexicons/ (LD-12).
#
# Patterns run on NormalizedRequest.model_text (English lower-cased; Arabic normalized: أ/إ/آ→ا, ى→ي, ة→ه).
# Write natural Arabic: the loader applies the same character map to each pattern; all case-insensitive.
#
# `danger` = an immediate physical hazard to people. Offline it is the ONLY source of `safety=True`, which
# floors the batch priority to high. A false hit raises a row to high, so these stay narrow:
#   GATE: zero hits on every non-high official row, and hits on exactly the four official safety scenarios
#   (TR-S03 stuck lab door, TR-S19/TR-S29 water near electricity, TR-S31 students stranded)
#   (tests/unit/test_safety.py). Generic words ("fire alarm", "extinguisher", "door is stuck") do not fire.
# `distress` = a person in crisis (self-harm, suicidal thoughts, panic). Online the use case stops and shows
#   support; in batch it is a flag only and never changes a label. Frustration ("this portal is killing me")
#   must NOT match.
# Precedence when both match: distress (see SafetyGuard).

danger:
  # --- EN: trapped / stranded --------------------------------------------------------------------------
  - '\b(can(no|'')?t|unable\s+to|could\s*n''?t|are\s+not\s+able\s+to)\s+(leave|get\s+out|exit|escape|get\s+home)\b'
  - '\b(trapped|stranded)\b'
  - '\b(locked|stuck|shut)\s+(in|inside)\s+(the\s+|a\s+|an\s+|our\s+)?(lab|laboratory|room|elevator|lift|building|class\w*|hall|toilet|bathroom|library|lecture\s+\w+)\b'
  - '\bstudents?\s+(are\s+|were\s+|got\s+|have\s+been\s+)?(left|stuck|stranded)\s+(behind|without|at|on|in|outside)\b'
  # people trapped in a stuck lift (live API run on rc1: "The elevator in building C is stuck between floors with
  # people inside" came out medium). People must be mentioned: a stuck lift on its own is a fault, not a danger.
  - '\b(elevator|lift)\b[^.!?|]{0,40}\bstuck\b[^.!?|]{0,40}\b(people|students?|someone|somebody|staff|passengers|kids)\b'
  - '\b(people|students?|someone|somebody|staff|passengers)\s+(are\s+|is\s+|were\s+)?(stuck|locked)\s+(inside|in\s+(it|there|the\s+(elevator|lift)))\b'
  - '\b(no|without\s+an?y?)\s+(way|transport\w*|ride|bus)\s+(home|back)\b'
  # --- EN: water near electricity, fire, gas, shock, collapse, injury --------------------------------
  - '\b(water|leak\w*|flood\w*|spill\w*|dripping)\b[^.!?|]{0,40}\b(electric\w*|sockets?|outlets?|wir(e|es|ing)|cables?|power\s+strip|plugs?)\b'
  - '\b(electric\w*|sockets?|outlets?|wir(e|es|ing)|cables?|power\s+strip)\b[^.!?|]{0,40}\b(water|leak\w*|flood\w*|wet|dripping)\b'
  - '\b(on\s+fire|caught\s+fire|fire\s+broke\s+out|there\s+is\s+a\s+fire|there''s\s+a\s+fire|a\s+fire\s+(in|at|on|near)\b)'
  - '\bsmoke\s+(is\s+)?(coming|filling|pouring|from|in\s+the)\b'
  - '\bsmell(s|ing)?\s+(of\s+|like\s+)?(gas|smoke|burning)\b'
  - '\bgas\s+(leak\w*|smell\w*)\b'
  - '\b(burning\s+smell|sparks?\s+(from|coming|flying)|sparking|electric(al)?\s+shock|electrocut\w*|exposed\s+(live\s+)?wir(e|es|ing))\b'
  - '\b(ceiling|roof|wall|stairs?)\s+(is\s+|are\s+)?(falling|fell|collaps\w*|caved)\b'
  - '\b(is|are|got|been|was|were)\s+(badly\s+|seriously\s+)?(injured|bleeding|unconscious)\b'
  - '\b(fainted|passed\s+out|not\s+breathing|having\s+a\s+seizure)\b'
  # --- AR ---------------------------------------------------------------------------------------------
  - '(ضلوا|ظلوا|علقوا|ضلينا|ظلينا|انحبسوا|انحبسنا)\s+(ال)?طلاب'
  - '(ال)?طلاب\s+(عالقين|محبوسين|محصورين|محشورين)'
  - '(ناس|حدا|اشخاص|أشخاص|طالب|طالبة|موظف|موظفين)\s+(عالق|عالقين|عالقة|محبوس|محبوسين|محبوسة|محصورين)'
  - '(المصعد|الاسانسير|الأسانسير|المصاعد)[^.؟!|]{0,40}(علق|عالق|معلق|معلّق|واقف|وقف)[^.؟!|]{0,40}(ناس|طلاب|حدا|اشخاص|أشخاص|فيه\s+ناس|جواه)'
  - '(بدون|بلا|من\s+غير)\s+مواصلات'
  - '(ما\s+في|مافي|ما\s+فيه)\s+مواصلات'
  - '(محبوس|محبوسين|انحبس|انحبسنا|انحبسوا|عالق|عالقين|عالقة)\s+(في|ب|جوا|داخل)'
  - '(مش|مو|ما)\s+(قادرين|قادر|بنقدر|بقدر|بيقدروا|بقدروا)\s+(نطلع|يطلعوا|اطلع|نخرج|يخرجوا)'
  - '(تسرب|بتسرب|تسريب|بنقط|بتنقط|بيدلف|رشح)[^.؟!|]{0,30}(كهربا|كهرباء|فيش|بريز|أسلاك|سلك|إفياش)'
  - '(?:^|\s)(?:و|ف)?(?:في\s+)?(?:مي|مية|مياه|ماء|مويه)(?:\s|$)[^.؟!|]{0,30}(كهربا|كهرباء|فيش|بريز|أسلاك|سلك)'
  - '(كهربا|كهرباء|فيش|بريز|أسلاك)[^.؟!|]{0,30}(تسرب|بتسرب|مي\s|مية|مياه|ماء|مويه|مبلول)'
  - 'حريق|ولعت\s+نار|في\s+نار|اشتعل|دخان|(ريحة|ريحه|رائحة)\s+(غاز|دخان|حريق)|(تسرب|تسريب)\s+غاز|غاز\s+(بتسرب|بيسرب)'
  - 'شرار|كهربني|كهربت|انكهرب|تكهرب|(سلك|أسلاك)\s+(مكشوف|مكشوفة|عريان|عريانة)'
  - '(انصاب|انصابت|بنزف|بينزف|نزيف|أغمي\s+عليه|اغمى\s+عليه|مغمى\s+عليه|فاقد\s+الوعي|ما\s+بتنفس)'
  - '(السقف|الحيط|الدرج)\s+(وقع|بوقع|رح\s+يوقع|انهار|بنهار)'
  # --- Arabizi (original half of model_text) ----------------------------------------------------------
  - '\b(ma7boseen|m7boseen|ma7boos|m7bos|ma7bous|3al2aneen|3al2een|3al2an|3al2|3alqeen)\b'
  - '\b(bdoon|bdun|bedun|bidoon|bedoon|bala|min\s+gher|men\s+3'')\s+(mwasalat|mowasalat|mawaslat|mwaslat|mowaslat)\b'
  - '\b(dallo|dallu|thallo|9allo|3el2o|3l2o)\s+(el\s*)?(tolab|6olab|tullab|tolaab)\b'
  - '\b(7ari2|7aree2|7ari8|7ar2a|do5an|dokhan|du5an|dukhan)\b'
  - '\b(ri7et|ri7it|rihet|re7et)\s+(gaz|ghaz|ghaaz|do5an)\b'
  - '\b(tasarrob|tasarub|btesarreb|bitsarrab|btsarrab|btnaa6|bitna66)\b[^.!?|]{0,30}\b(kahraba|kahrba|kahraba2|keherba)\b'
  - '\b(kahraba|kahrba|kahraba2|keherba)\b[^.!?|]{0,30}\b(tasarrob|tasarub|btesarreb|bitsarrab|btsarrab|mai|mayy|mayeh|maya)\b'
  - '\b(mai|mayy|mayeh|maya)\b[^.!?|]{0,30}\b(kahraba|kahrba|kahraba2|keherba)\b'
  # ===== P7.2 additions. Same gate. Tone words ("urgent", "bsor3a", "3ajel", CAPS) are never a cue. ============
  # Several groups below use order-free lookaheads inside one sentence (no '.', '!', '?', '|' between the cues),
  # so the word order of the report does not matter. A plain outage (no people at risk) is NOT danger.
  # --- EN: transport hazards (breakdown with passengers on a road, reckless driving) -------------------------
  - '(?=[^.!?|]*\b(bus(es)?|coach|shuttle|minibus|van)\b)(?=[^.!?|]*\b(broke\s*down|broken\s*down|breakdown|break\s*down|stalled|stopped|stuck|died|won''?t\s+start|overheat\w*|flat\s+ti(y|r)e|caught\s+fire)\b)(?=[^.!?|]*\b(highway|motorway|freeway|road|roadside|desert\s+road|bridge|tunnel|autostrad\w*|shoulder)\b)(?=[^.!?|]*(\binside\b|\bon\s*board\b|\baboard\b|\bstranded\b|\bpassengers\b|\bstill\s+(in|on)\b|\d+\s+(of\s+us|students?|passengers|people|kids)|\bwith\s+\w+\s+(students?|passengers|people|kids)|\bno\s*one\s+(came|is\s+coming|has\s+come)|\bnobody\s+(came|is\s+coming)))[^.!?|]+'
  - '\b(driv(es|ing|er)?|speed(s|ing)?|overtak(es|ing))\b[^.!?|]{0,25}\b(dangerous(ly)?|reckless(ly)?|like\s+(crazy|a\s+maniac|mad)|too\s+fast|(way\s+)?over\s+the\s+speed\s+limit|unsafe(ly)?)\b'
  - '\b(almost|nearly|just\s+missed|came\s+close\s+to)\s+(crash\w*|hit\s+(a|the|us|someone|me|people|students)|run\s+(us\s+|someone\s+|people\s+)?over|had\s+an\s+accident|caused\s+an\s+accident)\b'
  - '\b(bus|shuttle|driver|coach|minibus)\b[^.!?|]{0,40}\b(ran|running|jumped|jumps|skipped)\s+(a\s+|the\s+)?red\s+light\b'
  - '\bdriver\b[^.!?|]{0,40}\b(drunk|intoxicated|falling\s+asleep|fell\s+asleep|asleep\s+at\s+the\s+wheel|texting\s+while\s+driving)\b'
  - '\b(car|bus|traffic|road)\s+(accident|crash)\b|\bran\s+over\b|\bhit[-\s]and[-\s]run\b'
  # --- EN: power cut with people at risk ---------------------------------------------------------------------
  - '(?=[^.!?|]*\b(power|blackout|black\s*out|electricity|lights?|outage)\b)(?=[^.!?|]*\b(dark|darkness|pitch\s+black|no\s+lights?|can''?t\s+see)\b)(?=[^.!?|]*\b(stairs?|stairwell|staircase|corridor|hallway|basement|parking|garage|elevator|lift)\b)(?=[^.!?|]*\b(stuck|trapped|fell|fallen|falling|tripp\w*|injur\w*|scared|afraid|panic\w*|people|students?|someone|somebody|girls?)\b)[^.!?|]+'
  - '\b(emergency\s+(lights?|lighting|exit\s+lights?)|exit\s+signs?)\b[^.!?|]{0,30}\b(off|out|dead|not\s+working|failed|down|dark|broken)\b'
  - '\b(no|without)\s+(any\s+)?emergency\s+(lights?|lighting)\b'
  - '\b(stuck|trapped|stranded|locked)\s+in\s+the\s+dark\b'
  # --- EN: gas and fumes, weapons, structural hazards, an explicit risk to people ----------------------------
  - '\bgas\b[^.!?|]{0,25}\b(leak\w*|escap\w*|hiss\w*|spreading)\b|\b(leak\w*|escap\w*)\s+gas\b'
  - '\b(strong|bad|heavy|chemical|toxic)\s+(smell|odou?r|fumes?)\b[^.!?|]{0,25}\b(gas|smoke|chemicals?|burning|fumes?|lab)\b'
  - '\b(toxic|chemical|harmful)\s+(fumes?|gas|leak|spill)\b|\bcarbon\s+monoxide\b'
  - '\b(dizzy|coughing|choking|nauseous|can''?t\s+breathe|difficulty\s+breathing)\b[^.!?|]{0,50}\b(smell|fumes?|smoke|gas|chemicals?)\b|\b(smell|fumes?|smoke|gas|chemicals?)\b[^.!?|]{0,50}\b(dizzy|coughing|choking|nauseous|can''?t\s+breathe|difficulty\s+breathing)\b'
  - '\b(knife|gun|weapon|pistol|firearm|blade)\b[^.!?|]{0,40}\b(threat\w*|attack\w*|stab\w*|shoot\w*|brandish\w*|waving|point(ed|ing)?\s+at)\b|\b(threat\w*|attack\w*|stab\w*|shoot\w*|brandish\w*)\b[^.!?|]{0,40}\b(knife|gun|weapon|pistol|firearm|blade)\b|\b(student|man|guy|someone|person)\s+(has|with|holding|carrying|brought)\s+(a\s+)?(knife|gun|weapon|pistol|firearm|blade)\b'
  - '\b(railing|balcony|walkway|scaffold\w*|handrail|chandelier|lamp\s*post)\b[^.!?|]{0,30}\b(collaps\w*|fell|falling|fallen|came\s+down|broke\s+off|detached|about\s+to\s+fall)\b'
  - '\b(someone|somebody|people|students?|kids?)\s+(could|might|may|will|is\s+going\s+to|are\s+going\s+to)\s+(get\s+)?(seriously\s+)?(hurt|injured|killed|electrocuted)\b'
  # --- AR: transport, driving, power cut with people at risk, gas and fumes, weapons, structural -------------
  - '(?=[^.؟!|]*(الباص|باص|الحافله|حافله|الحافلة|حافلة|الكوستر|السرفيس|الشاتل|الميني\s*باص))(?=[^.؟!|]*((?<!م)وقف|تعطل|عطلان|عطل|خرب|علق|طفى|بنشر|ما\s+بيمشي|ما\s+عاد\s+يمشي|انفجر))(?=[^.؟!|]*(الطريق|طريق|الاوتوستراد|اوتوستراد|الصحراوي|الصحراء|الجسر|النفق|السريع))(?=[^.؟!|]*(فيه|فينا|جواه|جوا|داخل|عالقين|ركاب|راكب|ما\s*حدا\s*(اجا|إجا)|محدا\s*(اجا|إجا)|السواق\s+(نزل|راح|ترك)|ضلينا|ظلينا|[\d٠-٩]+\s+(طالب|طلاب|شخص|راكب)))[^.؟!|]+'
  # P7.8: Modern Standard Arabic breakdown (تعطلت / توقفت / عطل) with students on board; the people cue also takes
  # "على متنها", "يوجد" and a student noun, so spelled-out counts ("ثلاثين طالبة") work.
  - '(?=[^.؟!|]*(الباص|باص|الحافله|حافله|الحافلة|حافلة|الكوستر|الشاتل|الميني\s*باص|المركبه|مركبه|وسيله\s+النقل))(?=[^.؟!|]*((?<!م)توقفت|(?<!م)توقف|تعطلت|تعطل|عطل|عطب|اعطال|تعطلت|(?<!م)وقفت|خرب|اشتعل|احترق|انفجر))(?=[^.؟!|]*(الطريق|طريق|الاوتوستراد|اوتوستراد|الصحراوي|الصحراء|الجسر|النفق|السريع|الخارجي|الدائري))(?=[^.؟!|]*(متنها|متنه|على\s+متن|يوجد|توجد|جواها|جواه|داخل|عالقين|عالقات|ركاب|راكب|(طالب|طلاب|طالبه|طالبات|طلبه)\s|(طالب|طلاب|طالبه|طالبات|طلبه)$|[\d٠-٩]+\s+(طالب|طلاب|شخص|راكب)))[^.؟!|]+'
  - '(السواق|السائق|سائق\s+\S+|الشوفير|سواق)[^.؟!|]{0,40}(يقود|قاد|يسوق|قيادته|قياده)[^.؟!|]{0,25}(بتهور|متهور|بشكل\s+(خطير|متهور)|بسرعه\s+(جنونيه|عاليه|زايده|كبيره|مفرطه|خطيره))'
  - '(السواق|السائق|سائق\s+\S+|الشوفير)[^.؟!|]{0,40}(تجاوز|تخطى|تخطي|قطع|تجاوزت|تخطت)\s+(ال)?اشاره\s+(ال)?(حمراء|حمرا|حمراء|حمره)'
  - '(السواق|السائق|الشوفير|سواق)[^.؟!|]{0,30}(بسوق|يسوق|بيسوق|سايق|عم\s+يسوق)[^.؟!|]{0,25}(بسرعه|بتهور|متهور|مجنون|بجنون|بشكل\s+خطير|زي\s+المجنون|خطير|خطر)'
  - '(بسوق|يسوق|بيسوق|عم\s+يسوق)\s+(بتهور|متهور|بجنون|زي\s+المجنون|بسرعه\s+(جنونيه|عاليه|زايده|كبيره|خطيره))'
  - '(كاد|قرب|كان\s+(رح|راح|رايح))\s+(ان\s+|انو\s+)?(يعمل\s+|يصير\s+)?(حادث|يدعس|يصدم)'
  - '(السواق|السائق|الشوفير)[^.؟!|]{0,40}(قطع|طلع|مر)\s+(على\s+)?(الاشاره|اشاره)\s+(الحمرا|الحمراء|الحمره)'
  - '(السواق|السائق|الشوفير)[^.؟!|]{0,40}(سكران|ناعس|نايم|عم\s+ينام)'
  - 'حادث\s+(سير|دعس|طرق)|دعس\s+(طالب|طالبه|حدا|واحد)'
  - '(?=[^.؟!|]*(الكهربا|كهربا|الكهرباء|الانوار|الضو|النور|الاضاءه|الاضاءة))(?=[^.؟!|]*(عتمه|عتمة|معتم|ظلمه|ظلمة|مظلم|ظلام|دلمه))(?=[^.؟!|]*(الدرج|درج|السلالم|الممر|البدروم|القبو|الموقف|المصعد|الاسانسير|الأسانسير))(?=[^.؟!|]*(ناس|طلاب|طالب|بنات|حدا|عالقين|محبوسين|وقع|وقعت|خايفين|خايف|ما\s+بنشوف|مش\s+شايفين|ما\s+بشوف|مش\s+شايف|اصابه|انصاب))[^.؟!|]+'
  - '(اضاءه|اضاءة|انوار|اضواء|ضو|ضوء)\s+(ال)?(طوارئ|طوارىء|الطوارئ)[^.؟!|]{0,25}(طافيه|طافية|مطفاه|مش\s+شغاله|ما\s+بتشتغل|معطله|خربانه|مقطوعه|مش\s+شغالة|ما\s+اشتغلت)'
  - '(عالقين|محبوسين|ضلينا|ظلينا|ظلوا|ضلوا)\s+(ب|في\s+)(ال)?(عتمه|عتمة|ظلام|ظلمه|ظلمة)'
  - '(في|فيه|عم\s+يطلع|بيطلع|طالع|مسرب|بيتسرب|عم\s+بيتسرب|تسرب)\s+(ال)?غاز'
  - '(ال)?غاز[^.؟!|]{0,25}(ريحه|ريحة|رائحه|رائحة|منتشر|مسرب|بيطلع|طالع|يتسرب|بيتسرب|عم\s+يتسرب|مفتوح)'
  - '(ريحه|ريحة|رائحه|رائحة)[^.؟!|]{0,15}(غاز|حرق|محروق|كيماويه|كيماوي|كيميائيه|كيميائي|سم)'
  - '(تسرب|انسكاب|انسكب|انكب)\s+(مواد\s+)?(كيماويه|كيماوي|كيميائيه|كيميائي|حمض)'
  - '(ضيق|صعوبه|صعوبة)\s+(في\s+)?(التنفس|نفس)|(مش|ما)\s+(قادر|قادره|عم\s+بقدر|بقدر)\s+اتنفس'
  - '(بيسعلوا|عم\s+يسعلوا|عم\s+بسعل|بدوخوا|عم\s+يدوخوا|مدوخين|دوخه|دوخة)[^.؟!|]{0,50}(ريحه|ريحة|غاز|دخان|كيماوي)|(ريحه|ريحة|غاز|دخان|كيماوي)[^.؟!|]{0,50}(بيسعلوا|عم\s+يسعلوا|عم\s+بسعل|بدوخوا|عم\s+يدوخوا|مدوخين|دوخه|دوخة)'
  - 'اغماء|ما\s+(بتفتح|بيفتح|عم\s+(تفتح|يفتح))\s+عيون'
  - '(سكين|مسدس|سلاح|رشاش)[^.؟!|]{0,40}(يهدد|تهديد|بيهدد|عم\s+يهدد|هدد|معه|معها|حامل|شاهر|بالساحه|بالجامعه)'
  - '(الدرابزين|السياج|الشرفه|الشرفة|البلكونه|البلكونة|السقاله|السقالة|العامود)[^.؟!|]{0,30}(وقع|انهار|انكسر|بوقع|رح\s+يوقع|ساقط|سقط)'
  - '(حدا|واحد|طالب|الطلاب|ناس)\s+(ممكن|رح|راح|بدو)\s+(يتأذى|يتاذى|يموت|يتعور|ينصاب|يتكهرب|يوقع)'
