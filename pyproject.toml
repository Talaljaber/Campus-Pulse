# Root config: ruff only. Package metadata lives in services/ai/pyproject.toml.
[tool.ruff]
target-version = "py311"
line-length = 110
# Legacy data scripts predate the lint rules; they stay byte-stable (only the P0.3c print guard may change them).
extend-exclude = ["scripts/clean_data.py", "scripts/test_clean.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sklearn.model_selection.train_test_split".msg = "random splits are forbidden (SPEC §3); use adapters.training.cv"
"sklearn.model_selection.KFold".msg = "random splits are forbidden (SPEC §3); use adapters.training.cv"
"sklearn.model_selection.StratifiedKFold".msg = "random splits are forbidden (SPEC §3); use adapters.training.cv"
"sklearn.model_selection.ShuffleSplit".msg = "random splits are forbidden (SPEC §3); use adapters.training.cv"
"sklearn.model_selection.StratifiedShuffleSplit".msg = "random splits are forbidden (SPEC §3); use adapters.training.cv"
