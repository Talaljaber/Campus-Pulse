# Dataset rules: validation floors, audit and leakage thresholds (ML stream).
# Read by scripts/test_data_audit.py, scripts/check_leakage.py and (from P1.0) scripts/validate_dataset.py.
# No threshold lives in code: change it here and re-run the scripts.

audit:
  # scripts/test_data_audit.py check 4: max allowed char 3-5-gram TF-IDF cosine between rows of
  # different cv_groups (official max today: 0.375).
  near_dup_cosine: 0.8

leakage:
  # scripts/check_leakage.py: fail on any cross-group pair with char_wb 3-5-gram TF-IDF cosine >= this.
  char_cosine: 0.8
  # P2.1 (encoder mode): print cross-group pairs with encoder cosine >= this for a manual merge decision.
  cosine_merge: 0.90
  # P2.1: which holdout measures FAIL the gate for an augmented row (the others are listed for review).
  # Measured with the int8 e5 encoder (ML batch 4): different official scenarios reach cosine 0.919
  # (median 0.804), and true EN<->AR translations of one scenario have a median of 0.845, so an encoder
  # cosine of 0.90 marks a shared topic, not a duplicate. exact and char (char_cosine) identify real copies.
  # scripts/draft_augmentation.py is stricter: it drops any LLM draft with encoder cosine >= cosine_merge
  # (or char >= char_cosine) to any holdout row before writing it.
  holdout_fail_on: [exact, char]

# ---- scripts/validate_dataset.py (P1.0): one block per --kind ----------------------------------------------
# Labels are checked against campuspulse_ai.domain.labels (the only place label strings live).
our_test:                       # data/our_test/our_test.csv, built from set1..set3 by build_our_test.py (D-010)
  columns: [request_id, text, lang, category, priority, author_method, test_set, scenario_family, notes]
  id_pattern: '^[A-Z0-9]+-\d{4}$'   # original set ids are kept: HT-0001, T2-0001, T3-0001
  langs: [en, ar, arabizi]
  author_methods: [hand, claude]    # set1 by the developer, sets 2-3 by Claude (D-010)
  test_sets: [set1, set2, set3]
  # Floors apply to the POOLED file: set1 alone covers 6/18 cells and has no Arabizi.
  min_rows: 60
  min_per_cell: 3               # 6 categories x 3 priorities = 18 cells
  min_per_lang: {en: 20, ar: 20, arabizi: 10}
  min_wrapped_rows: 6           # rows carrying an official-style wrapper (URGENT:, مرحبا،, ...)
  forbid_official_overlap: true # normalize(core, lang) must not equal any official text_norm

augmented:                      # data/augmented/*.csv (ARCHITECTURE §4.2 schema, data/augmented/README.md)
  columns: [request_id, text, lang, source, source_scenario_id, cv_group, needs_human_check, author_method,
            category, priority]
  id_pattern: '^AUG-[A-Z]+-\d{4}$'
  langs: [en, ar, arabizi]
  sources: [arabizi_rule, llm_paraphrase, llm_arabizi, new_scenario, hand]
  author_method_pattern: '^(rule|hand|llm(:\S+)?)$'   # P2.2 writes llm:<model_id>
  new_group_pattern: '^(NEW|MEM)-[A-Za-z0-9-]+$'      # groups/scenarios that are not official
  arabizi_variants: 2           # scripts/draft_augmentation.py arabizi-rule: spellings per Arabic scenario
  arabizi_min_detection: 0.95   # share of reviewed lang=arabizi rows LangIdentifier must call ARABIZI (§3.7)

probes:                         # data/robustness/probes.csv (P2.5)
  columns: [request_id, text, lang, style, base_request_id, intended_category, intended_priority,
            expected_flags, author_method, notes]
  id_pattern: '^PR-\d{3}$'
  langs: [en, ar, arabizi]
  author_methods: [hand, perturb]
  min_rows: 40
  styles: [fake_urgency, calm_emergency, typos, arabizi, mixed_language, two_issues, very_long, injection,
           off_topic, distress_adjacent, deadline_shortcut]
  min_per_style: 3
  flag_separator: ';'           # expected_flags: e.g. "injection_attempt;distress" (values from domain FLAGS)
  forbid_official_overlap: true
