# P7.4 / D-050: the optional LLM front end (translate Arabic and Arabizi to English, plus an internal
# label-blind explanation column), behind --use-llm or LLM_FRONTEND=true with OPENROUTER_API_KEY.
# Never part of the scored offline path. The model id is pinned; change it only with a new decision.
model: deepseek/deepseek-v4.1-flash      # alternative: qwen/qwen3.8-flash
prompt_version: p74-v1
timeout_s: 8
max_retries: 1
max_tokens: 600
reasoning: {enabled: false}             # sent as the OpenRouter `reasoning` parameter (off)
workers: 8                                # parallel calls inside one batch
explain_english: false                    # English goes straight to the model with no LLM call (the train-time explanations are already cached)
cache_path: .cache/llm_frontend.sqlite

# P7.9 / D-056: the LLM's structured cues as a raise-only HIGH priority floor, floor name `llm_cue`. Active only
# with the LLM front end on and a valid reply for the row (Arabic and Arabizi; English is lexicon-only). A rule
# holds when every listed cue matches (a bool must equal, other cues must be one of the listed values). Tone
# (`urgency` alone) is never a rule. The floor never lowers a priority and sits below the lexicon floors.
cue_floor:
  enabled: true
  rules:
    physical_danger: {physical_danger: true}
    account_compromise: {account_compromise: true}
    group_outage: {outage: true, affected: [group, campus], kind: [fault], urgency: [time_sensitive, urgent]}
    deadline_fault: {deadline: [hours], kind: [fault]}

# D-058 (2026-11-06): the set-constrained tie-breaker (P3.3, prompt config/prompts/oracle_<version>.md) in
# predict.py's LLM mode. Rows whose conformal category or priority set holds 2+ labels ask the LLM, which may
# only pick inside those sets; LLMMerger mixes its vote in with the frozen w_llm. Injection-flagged rows never
# reach it; any failure keeps the model's labels. OPENROUTER_TIER1_MODEL overrides `model`; LLM_ORACLE=false
# turns it off (measurements).
oracle:
  enabled: true
  model: deepseek/deepseek-v4.1-flash
  prompt_version: v3  # config/prompts/oracle_v3.md (v2 + duration and outage wording; D-059)
  priority: true      # ask about priority on every row with all labels open
  lower_unflagged_high: true  # D-059: a model `high` no safety/deadline floor set may be corrected too
  category_top_k: 3   # D-060: the LLM may choose among the model's top 3 categories (0 = calibrated set only)
# Measurement switches (env): LLM_ORACLE=false (no tie-breaker), LLM_ORACLE_PRIORITY=false (category only),
# LLM_ORACLE_PROMPT_VERSION=v1|v2|v3, LLM_ORACLE_LOWER_HIGH=false (always keep a model `high`),
# LLM_ORACLE_CATEGORY_TOP_K=3 (category choice among the model's top 3).
