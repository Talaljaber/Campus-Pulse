# Arabizi (Jordanian Arabic in Latin script) lexicon and transliteration rules (P1.2, ARCHITECTURE §3.7).
# Read by campuspulse_ai.adapters.preprocess.langid.LangIdentifier.from_yaml and
# campuspulse_ai.adapters.preprocess.arabizi.ArabiziTransliterator.from_yaml.
# Entries were drafted with LLM help and must be checked by the developer (README Disclosures).
# train.py snapshots this file into models/frozen/vN/lexicons/ (LD-12).
#
# DETECTION is deliberately conservative: a false Arabizi positive on an English hidden-test row is the only
# way this step can cost macro-F1. A text is ARABIZI only if it is mostly Latin, has >= min_digit_tokens
# Arabizi digit-words OR >= min_lexicon_hits detection-lexicon words, AND has ZERO guard hits.

signal_digits: ["2", "3", "5", "6", "7", "8", "9"]
min_digit_tokens: 2
min_lexicon_hits: 1
# a digit-word must also contain at least this many Latin letters ("b3", "m2" are codes, not words)
min_letters_in_digit_token: 2

# One guard hit vetoes ARABIZI: English function words and ordinal/time/unit/version tokens.
guard_tokens: [
  "2nd", "3rd", "1st", "4th", "5th", "6th", "7th", "8th", "9th", "24/7", "b4", "4u", "2u", "gr8", "mp3", "mp4",
  "covid19", "covid-19", "h2o", "2fa", "ipv4", "ipv6", "a4", "a3", "3d", "2d", "g5", "5g", "4g", "3g",
  "the", "a", "an", "is", "are", "was", "were", "be", "been", "being", "am", "i", "i'm", "im", "i've", "i'd",
  "my", "me", "mine", "you", "your", "you're", "we", "our", "us", "they", "their", "them", "he", "she", "his",
  "her", "it", "it's", "its", "this", "that", "these", "those", "there", "here", "to", "of", "in", "on", "at",
  "for", "from", "with", "by", "about", "into", "onto", "over", "under", "and", "or", "but", "not", "no", "can",
  "can't", "cannot", "cant", "could", "couldn't", "would", "should", "will", "won't", "do", "does", "did",
  "don't", "dont", "doesn't", "didn't", "have", "has", "had", "haven't", "hasn't", "need", "needs", "please",
  "help", "what", "where", "when", "why", "how", "who", "which", "if", "so", "because", "after", "before",
  "again", "still", "today", "tomorrow", "yesterday", "tonight", "morning", "all", "any", "some", "every",
  "just", "also", "very", "than", "then", "now", "get", "got", "want", "know", "isn't", "aren't", "wasn't",
  "hi", "hello", "thanks", "thank", "dear", "regards", "sorry"
]
# A token fully matching one of these also vetoes (ordinals, clock times, units, versions).
guard_patterns: [
  "^\\d+(st|nd|rd|th)$",
  "^\\d{1,2}(:\\d{2})?(am|pm)$",
  "^\\d+(gb|mb|kb|tb|ghz|mhz|km|kg|cm|mm|jd|jod|usd|min|mins|hr|hrs|sec|secs|pcs)$",
  "^(mp|ipv|win|windows|ios|android|covid|python|java|office|excel|html|css)\\d+$"
]
# Tokens fully matching these neither count as Arabizi nor veto (course codes, room codes, plain numbers).
ignore_patterns: [
  "^[a-z]{1,5}-?\\d{2,4}[a-z]?$",
  "^\\d+([./:-]\\d+)*$"
]

# Lexicon keys that are transliterated but do NOT count as Arabizi evidence: English homographs
# ("fee", "law", "min", "men", "sir", "into", ...) and English loanwords common in English requests.
not_signals: [
  "ma", "la", "law", "min", "men", "ya", "hay", "aw", "ah", "hal", "sir", "net", "bus", "doctor", "exam", "wifi",
  "internet", "projector", "password", "email", "lab", "portal", "system", "mush", "shi", "fee", "into", "al",
  "dow", "mai", "sar", "kam", "bad", "hon", "mall", "laptop", "online", "moodle", "sis", "id", "card", "office",
  "bank", "visa", "app", "website", "link", "file"
]

# Standalone proclitics are glued to the next transliterated token ("el bus" -> "الباص", "w el" -> "وال").
proclitics:
  el: "ال"
  il: "ال"
  al: "ال"
  w: "و"
  b: "ب"
  bel: "بال"
  bil: "بال"
  lal: "لل"
  3al: "عال"

# Applied to non-lexicon tokens: digraphs first (longest first), then single characters.
digraphs:
  "3'": "غ"
  "6'": "ظ"
  "9'": "ض"
  sh: "ش"
  kh: "خ"
  gh: "غ"
  th: "ث"
  dh: "ذ"
  ch: "تش"
